spring.application.name=CoreAI
# OpenAI API configuration
spring.ai.openai.api-key=_
spring.ai.openai.chat.base-url=${OPEN_AI_BASE_URL}
spring.ai.openai.chat.options.model=${OPEN_AI_MODEL}

#Embedding Model locally
embedding.model.locally.base-url=${LOCAL_EMBEDDING_BASE_URL}
embedding.model.locally.uri=${LOCAL_EMBEDDING_URI}
embedding.model.locally.model=${LOCAL_EMBEDDING_MODEL}


# MCP
spring.ai.tools.enabled=true
spring.ai.mcp.client.enabled=true

spring.ai.mcp.client.initialized=true
#spring.ai.mcp.client.stdio.connections.docker-gateway.command=docker
#spring.ai.mcp.client.stdio.connections.docker-gateway.args=mcp,gateway,run

#pinecone
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME}